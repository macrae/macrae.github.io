name = "seanmacrae-com"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

# The committed static site plus mana-map's viz and handbooks, assembled by
# tools/assemble.py. NOT mana-map's data/ -- that is 238 MiB with one file over
# Cloudflare's 25 MiB asset cap, so it lives in R2 and is served by the Worker
# at /mana-map/data/*, which is the same path the viz's relative links already
# resolve to.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
# NO REDIRECTS. The default ("auto-trailing-slash") rewrites /foo.html to /foo,
# which turned every mana-map link -- its nav, its deck pages, every handbook
# -- into a 307 plus an extra round trip. Directory indexes and the 404 page
# are handled explicitly in worker/src/index.js instead.
html_handling = "none"

# The queryable data behind the visualisations. Content does NOT live here --
# posts stay markdown in git.
# Create with:  npx wrangler d1 create seanmacrae
# then paste the id below.
# [[d1_databases]]
# binding = "DB"
# database_name = "seanmacrae"
# database_id = "PASTE-AFTER-CREATE"

# Mana Map's artifacts.
#
# COMMENTED OUT UNTIL R2 IS ENABLED ON THE ACCOUNT. R2 is a one-time switch in
# the Cloudflare dashboard (Storage & Databases -> R2); until it is thrown, the
# API returns "Please enable R2" and a deploy carrying this binding is rejected
# outright -- taking the whole site down with it rather than just the data.
#
# The Worker already handles the absence: /mana-map/data/* answers 503 with a
# plain message, so the essays, the handbooks and the viz shell all serve while
# only the atlas's artifacts are missing.
#
# To finish:  npx wrangler r2 bucket create seanmacrae-data
#             uncomment the three lines below
#             make sync-data && make deploy
# [[r2_buckets]]
# binding = "DATA"
# bucket_name = "seanmacrae-data"

[vars]
GITHUB_REPO = "macrae/macrae.github.io"
GITHUB_BRANCH = "main"
# ACCESS_TEAM and ACCESS_AUD are set after the Access application exists.
# Until they are, /admin refuses every request rather than standing open.

# Secrets, set once and never committed:
#   npx wrangler secret put GITHUB_TOKEN     a fine-grained PAT, Contents: R/W
